<svg xmlns="http://www.w3.org/2000/svg" width="460" height="506" viewBox="0 0 400 440" role="img" aria-label="Schéma du cœur en vue de face, sans légende">
  <rect width="400" height="440" fill="#FFFFFF"/>
  <g fill="none" stroke-linecap="butt" stroke-linejoin="round">
    <!-- troncs supra-aortiques -->
    <path d="M270 40 V6 M296 34 V4 M322 40 V8" stroke="#15214A" stroke-width="16"/>
    <path d="M270 40 V6 M296 34 V4 M322 40 V8" stroke="#E04B55" stroke-width="10"/>
    <!-- artère pulmonaire (tronc + branches) -->
    <path d="M190 172 V105 M60 105 H320" stroke="#15214A" stroke-width="32"/>
    <path d="M190 172 V105 M60 105 H320" stroke="#4F7FE0" stroke-width="26"/>
    <!-- veine cave supérieure -->
    <path d="M115 18 V172" stroke="#15214A" stroke-width="40"/>
    <path d="M115 18 V172" stroke="#4F7FE0" stroke-width="34"/>
    <!-- aorte -->
    <path d="M246 172 V95 Q246 40 296 40 Q346 40 346 95 V200" stroke="#15214A" stroke-width="40"/>
    <path d="M246 172 V95 Q246 40 296 40 Q346 40 346 95 V200" stroke="#E04B55" stroke-width="34"/>
    <!-- veine cave inférieure -->
    <path d="M70 440 V280" stroke="#15214A" stroke-width="40"/>
    <path d="M70 440 V280" stroke="#4F7FE0" stroke-width="34"/>
    <!-- veines pulmonaires -->
    <path d="M398 176 H322 M398 222 H322" stroke="#15214A" stroke-width="24"/>
    <path d="M398 176 H322 M398 222 H322" stroke="#E04B55" stroke-width="18"/>
  </g>
  <!-- orifices des vaisseaux coupés -->
  <g fill="#15214A" opacity=".55">
    <ellipse cx="115" cy="20" rx="17" ry="4"/>
    <ellipse cx="62" cy="105" rx="4" ry="13"/>
    <ellipse cx="318" cy="105" rx="4" ry="13"/>
    <ellipse cx="270" cy="8" rx="5" ry="2"/>
    <ellipse cx="296" cy="6" rx="5" ry="2"/>
    <ellipse cx="322" cy="10" rx="5" ry="2"/>
  </g>
  <!-- myocarde -->
  <path d="M58 205 C56 165 80 148 120 148 L290 148 C330 148 350 170 348 210 C345 290 300 360 232 412 C222 419 212 418 204 410 C140 360 62 290 58 205 Z" fill="#F2C4B8" stroke="#15214A" stroke-width="4"/>
  <path d="M80 190 C86 168 100 160 124 158" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="5" stroke-linecap="round"/>
  <!-- cavités -->
  <g stroke="#15214A" stroke-width="2.5" stroke-linejoin="round">
    <path d="M80 205 C80 176 98 164 126 164 L184 164 L184 236 L88 236 C82 226 80 216 80 205 Z" fill="#8FB2F5"/>
    <path d="M216 164 L278 164 C306 164 326 178 328 206 C329 220 326 230 322 236 L216 236 Z" fill="#F48B8E"/>
    <path d="M82 254 L184 254 L184 368 C150 345 100 300 82 254 Z" fill="#8FB2F5"/>
    <path d="M216 254 L318 254 C312 310 278 358 226 392 C220 384 216 372 216 360 Z" fill="#F48B8E"/>
  </g>
  <!-- valves auriculo-ventriculaires -->
  <rect x="112" y="234.5" width="48" height="21" fill="#8FB2F5"/>
  <rect x="240" y="234.5" width="50" height="21" fill="#F48B8E"/>
  <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="square">
    <path d="M114 236 L126 266 M158 236 L146 266"/>
    <path d="M242 236 L254 266 M288 236 L276 266"/>
  </g>
  <g stroke="#15214A" stroke-width="2" fill="none">
    <path d="M112 236 L124 268 M160 236 L148 268"/>
    <path d="M240 236 L252 268 M290 236 L278 268"/>
  </g>
</svg>
